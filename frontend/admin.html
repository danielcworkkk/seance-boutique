<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SÉANCE - Admin Studio Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .serif { font-family: 'Playfair Display', serif; }
    .bg-canvas {
      background:
        radial-gradient(circle at 12% 10%, rgba(253, 224, 71, 0.26), transparent 30%),
        radial-gradient(circle at 94% 4%, rgba(56, 189, 248, 0.24), transparent 26%),
        linear-gradient(180deg, #f8fbff 0%, #efe8dc 56%, #e4dcca 100%);
    }
    .glass { backdrop-filter: blur(14px); background: rgba(255,255,255,0.84); }
    .card-shadow { box-shadow: 0 24px 70px rgba(31, 41, 55, 0.12); }
    .hero-ribbon {
      background: linear-gradient(130deg, #111827 0%, #1e3a8a 45%, #0e7490 100%);
      color: white;
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.3);
    }
    .tab-btn.active { background: #111827; color: white; border-color: #111827; }
    .variant-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  </style>
</head>
<body class="bg-canvas min-h-screen text-neutral-900">
  <div id="admin-gate" class="fixed inset-0 z-50 bg-black/70 px-4 flex items-center justify-center">
    <div class="glass card-shadow w-full max-w-lg rounded-[2rem] border border-white/60 p-6 sm:p-7">
      <p class="text-[10px] uppercase tracking-[0.3em] text-neutral-500 font-bold" data-i18n="gateTag">Staff Secure Login</p>
      <h2 class="text-2xl font-black mt-2" data-i18n="gateTitle">後台獨立安全登入</h2>
      <p class="text-sm text-neutral-600 mt-2" data-i18n="gateBody">只有店主與店員帳號可以登入，管理商品、庫存、訂單與優惠策略。</p>
      <div class="grid sm:grid-cols-2 gap-3 mt-5">
        <input id="gate-email" type="email" class="rounded-2xl border border-neutral-300 px-4 py-3" placeholder="staff@yourshop.com" data-i18n-placeholder="staffEmailPlaceholder" />
        <input id="gate-passcode" type="password" class="rounded-2xl border border-neutral-300 px-4 py-3" placeholder="admin" data-i18n-placeholder="staffPasswordPlaceholder" />
      </div>
      <p id="gate-status" class="text-xs text-neutral-500 mt-3"></p>
      <button id="gate-unlock" class="w-full mt-3 rounded-2xl bg-black text-white py-3 font-semibold" data-i18n="unlockDashboard">登入後台</button>
    </div>
  </div>

  <div id="admin-app" class="opacity-0 pointer-events-none select-none">
    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-5">
      <nav class="glass card-shadow border border-white/60 rounded-[1.75rem] px-4 sm:px-6 py-3.5 flex items-center justify-between gap-3">
        <div>
          <p class="serif text-2xl sm:text-3xl font-semibold">SÉANCE</p>
          <p class="text-[9px] uppercase tracking-[0.35em] text-neutral-500 -mt-0.5" data-i18n="adminStudio">Admin Studio Pro</p>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="lang-toggle" class="px-3 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold">中文 / EN</button>
          <button id="logout-admin" class="px-3 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-i18n="logout">登出</button>
          <a href="/" class="px-3 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-i18n="toStore">前台</a>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
      <section class="hero-ribbon rounded-[2rem] p-6 sm:p-7">
        <p class="text-[10px] uppercase tracking-[0.3em] font-bold" data-i18n="overviewTag">總覽</p>
        <h1 class="text-3xl sm:text-4xl font-black mt-2" data-i18n="overviewTitle">一站式管理直播時裝店</h1>
        <p class="text-sm text-white/80 mt-2" data-i18n="overviewSubtitle">支援多規格商品、即時庫存、訂單流程、店員帳號與優惠規則。</p>
      </section>

      <section class="glass card-shadow rounded-[2rem] border border-white/60 p-5 sm:p-6">
        <div class="flex flex-wrap gap-2" id="admin-tabs">
          <button class="tab-btn active px-4 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-tab="overview" data-i18n="tabOverview">總覽</button>
          <button class="tab-btn px-4 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-tab="products" data-i18n="tabProducts">商品與庫存</button>
          <button class="tab-btn px-4 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-tab="orders" data-i18n="tabOrders">訂單中心</button>
          <button class="tab-btn px-4 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-tab="marketing" data-i18n="tabMarketing">優惠與運費</button>
          <button class="tab-btn px-4 py-2 rounded-full border border-neutral-300 bg-white text-sm font-semibold" data-tab="staff" data-i18n="tabStaff">店員帳號</button>
        </div>
      </section>

      <section id="tab-overview" class="tab-pane glass card-shadow rounded-[2rem] border border-white/60 p-6 sm:p-7">
        <div id="stats" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
      </section>

      <section id="tab-products" class="tab-pane hidden grid lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="productFormTitle">上架 / 編輯商品</h2>
          <form id="product-form" class="space-y-4 mt-4">
            <input type="hidden" id="product-id" />
            <div class="grid grid-cols-3 gap-3">
              <input id="product-name-zh" type="text" class="rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="nameZhPlaceholder" placeholder="商品中文名" required />
              <input id="product-name-en" type="text" class="rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="nameEnPlaceholder" placeholder="Product English Name" required />
              <input id="product-price" type="number" min="1" step="0.01" class="rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="pricePlaceholder" placeholder="基本售價" required />
            </div>
            <input id="product-seen-at" type="text" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="seenAtPlaceholder" placeholder="直播時間 15:40" />
            <textarea id="product-desc" rows="3" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="descPlaceholder" placeholder="商品描述" required></textarea>
            <textarea id="product-size-chart" rows="2" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="sizeChartPlaceholder" placeholder="尺碼表"></textarea>
            <textarea id="product-washing-info" rows="2" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="washingPlaceholder" placeholder="洗滌說明"></textarea>

            <div class="rounded-2xl border border-neutral-200 bg-white p-4">
              <div class="flex items-center justify-between">
                <p class="text-sm font-bold" data-i18n="variantsTitle">Variants（顏色 / 尺碼 / 庫存 / 圖片）</p>
                <button id="add-variant" type="button" class="px-3 py-1.5 rounded-full border border-neutral-300 text-xs font-semibold" data-i18n="addVariant">新增規格</button>
              </div>
              <div id="variant-list" class="grid variant-grid gap-3 mt-3"></div>
            </div>

            <button class="w-full rounded-2xl bg-black text-white py-3 font-semibold" type="submit" data-i18n="saveProduct">儲存商品</button>
            <button id="reset-form" class="w-full rounded-2xl border border-neutral-300 bg-white py-3 font-semibold" type="button" data-i18n="newProduct">重設表單</button>
          </form>
        </div>

        <div class="lg:col-span-7 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="productListTitle">商品清單</h2>
          <div class="overflow-auto mt-4">
            <table class="w-full text-sm">
              <thead class="text-left text-[10px] uppercase tracking-[0.2em] text-neutral-500">
                <tr>
                  <th class="py-3" data-i18n="colItem">商品</th>
                  <th class="py-3" data-i18n="colStock">庫存</th>
                  <th class="py-3" data-i18n="colPrice">價格</th>
                  <th class="py-3 text-right" data-i18n="colAction">操作</th>
                </tr>
              </thead>
              <tbody id="products-table" class="divide-y divide-neutral-200"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="tab-orders" class="tab-pane hidden glass card-shadow rounded-[2rem] border border-white/60 p-6">
        <h2 class="text-2xl font-black" data-i18n="orderListTitle">訂單管理中心</h2>
        <p class="text-sm text-neutral-600 mt-1" data-i18n="orderListDesc">顯示顧客資料、購買內容、收貨地址與物流單號。</p>
        <div class="overflow-auto mt-4">
          <table class="w-full text-sm">
            <thead class="text-left text-[10px] uppercase tracking-[0.2em] text-neutral-500">
              <tr>
                <th class="py-3" data-i18n="colOrder">訂單</th>
                <th class="py-3" data-i18n="colCustomer">顧客</th>
                <th class="py-3" data-i18n="colItems">內容</th>
                <th class="py-3" data-i18n="colAddress">地址</th>
                <th class="py-3" data-i18n="colStatus">狀態</th>
                <th class="py-3" data-i18n="colTracking">順豐單號</th>
                <th class="py-3 text-right" data-i18n="colAction">操作</th>
              </tr>
            </thead>
            <tbody id="orders-table" class="divide-y divide-neutral-200"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-marketing" class="tab-pane hidden grid lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="couponTitle">優惠碼設定</h2>
          <form id="coupon-form" class="space-y-3 mt-4">
            <input id="coupon-code" type="text" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" placeholder="SUMMER10" required />
            <div class="grid grid-cols-2 gap-3">
              <select id="coupon-type" class="rounded-2xl border border-neutral-300 px-4 py-3">
                <option value="percent">Percent %</option>
                <option value="fixed">Fixed $</option>
              </select>
              <input id="coupon-value" type="number" class="rounded-2xl border border-neutral-300 px-4 py-3" min="1" step="0.01" placeholder="10" required />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input id="coupon-min-spend" type="number" min="0" step="0.01" class="rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="minSpendPlaceholder" placeholder="最低消費" />
              <input id="coupon-target-product" type="number" min="0" class="rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="targetProductPlaceholder" placeholder="指定商品 ID（可空白）" />
            </div>
            <input id="coupon-desc" type="text" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="couponDescPlaceholder" placeholder="優惠說明" />
            <button class="w-full rounded-2xl bg-black text-white py-3 font-semibold" type="submit" data-i18n="saveCoupon">儲存優惠碼</button>
          </form>

          <h3 class="text-xl font-black mt-7" data-i18n="shippingTitle">運費規則</h3>
          <form id="shipping-form" class="space-y-3 mt-3">
            <input id="free-shipping-threshold" type="number" min="0" step="0.01" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="freeShippingPlaceholder" placeholder="滿額免運門檻" required />
            <input id="default-shipping-fee" type="number" min="0" step="0.01" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="shippingFeePlaceholder" placeholder="預設運費" required />
            <button class="w-full rounded-2xl border border-neutral-300 bg-white py-3 font-semibold" type="submit" data-i18n="saveShipping">儲存運費規則</button>
          </form>
        </div>

        <div class="lg:col-span-7 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="couponListTitle">優惠碼清單</h2>
          <div id="coupon-list" class="mt-4 space-y-3"></div>
        </div>
      </section>

      <section id="tab-staff" class="tab-pane hidden grid lg:grid-cols-12 gap-6">
        <div class="lg:col-span-5 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="staffTitle">新增店員</h2>
          <form id="staff-form" class="space-y-3 mt-4">
            <input id="staff-email" type="email" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" placeholder="staff@yourshop.com" required />
            <input id="staff-password" type="password" minlength="6" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="staffPasswordPlaceholder" placeholder="店員密碼" required />
            <input id="staff-name" type="text" class="w-full rounded-2xl border border-neutral-300 px-4 py-3" data-i18n-placeholder="staffNamePlaceholder" placeholder="店員名稱" required />
            <select id="staff-role" class="w-full rounded-2xl border border-neutral-300 px-4 py-3">
              <option value="staff">Staff</option>
              <option value="owner">Owner</option>
            </select>
            <button class="w-full rounded-2xl bg-black text-white py-3 font-semibold" type="submit" data-i18n="addStaff">新增店員</button>
          </form>
        </div>
        <div class="lg:col-span-7 glass card-shadow rounded-[2rem] border border-white/60 p-6">
          <h2 class="text-2xl font-black" data-i18n="staffListTitle">店員清單</h2>
          <div id="staff-list" class="mt-4 space-y-3"></div>
        </div>
      </section>
    </main>
  </div>

  <template id="variant-template">
    <div class="rounded-xl border border-neutral-200 p-3 bg-neutral-50 space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <input class="variant-color rounded-xl border border-neutral-300 px-3 py-2 text-sm" placeholder="Color" />
        <input class="variant-size rounded-xl border border-neutral-300 px-3 py-2 text-sm" placeholder="Size" />
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input type="number" min="0" class="variant-stock rounded-xl border border-neutral-300 px-3 py-2 text-sm" placeholder="Stock" />
        <input type="number" min="1" step="0.01" class="variant-price rounded-xl border border-neutral-300 px-3 py-2 text-sm" placeholder="Price" />
      </div>
      <input type="file" accept="image/*" capture="environment" class="variant-photo-file w-full rounded-xl border border-neutral-300 bg-white px-3 py-2 text-sm" />
      <input type="url" class="variant-photo-url w-full rounded-xl border border-neutral-300 px-3 py-2 text-sm" placeholder="https://..." />
      <img class="variant-preview hidden w-full h-28 object-cover rounded-xl border border-neutral-200" alt="variant preview" />
      <button type="button" class="variant-remove w-full rounded-xl border border-neutral-300 py-2 text-xs font-semibold">Remove</button>
    </div>
  </template>

        status_pending: 'Unpaid', status_under_review: 'Under Review', status_paid: 'Paid', status_packing: 'Packing', status_shipped: 'Shipped', status_completed: 'Completed',
        loginFailed: 'Login failed. Check email and password.', loginSuccess: 'Logged in successfully', authRequired: 'Please login as admin first.',
        productSaved: 'Product saved.', couponSaved: 'Coupon saved.', shippingSaved: 'Shipping rules updated.', staffAdded: 'Staff added.', orderSaved: 'Order updated.',
        confirmStep1: 'Step 1 confirmation: Are you sure you want to continue?', confirmStep2: 'Step 2 confirmation: Please confirm again. This action will apply immediately.',
        confirmEditProduct: 'You are about to load this product for editing.',
        confirmDeleteProduct: 'You are about to delete this product.',
        confirmSaveProduct: 'You are about to save product changes.',
        confirmSaveOrder: 'You are about to update this order.',
        confirmDeleteCoupon: 'You are about to delete this coupon.',
        confirmSaveCoupon: 'You are about to create or update this coupon.',
        confirmSaveShipping: 'You are about to update shipping rules.',
        confirmAddStaff: 'You are about to add this staff account.',
        confirmDeleteStaff: 'You are about to delete this staff account.'
      }
    };

    function t(key) {
      return translations[state.lang][key] || translations.zh[key] || key;
    }

    function api(path, options = {}) {
      const isFormData = options.body instanceof FormData;
      return fetch(path, {
        ...options,
        headers: {
          ...(isFormData ? {} : { 'Content-Type': 'application/json' }),
          ...(state.adminToken ? { Authorization: `Bearer ${state.adminToken}` } : {}),
          ...(options.headers || {})
        }
      }).then(async (response) => {
        if (!response.ok) throw new Error(await response.text());
        return response.status === 204 ? null : response.json();
      });
    }

    function applyLanguage() {
      document.documentElement.lang = state.lang === 'zh' ? 'zh-Hant' : 'en';
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      renderStats();
      renderProducts();
      renderOrders();
      renderCoupons();
      renderStaff();
    }

    function unlockDashboard() {
      document.getElementById('admin-gate').classList.add('hidden');
      const app = document.getElementById('admin-app');
      app.classList.remove('opacity-0', 'pointer-events-none', 'select-none');
      app.classList.add('opacity-100');
    }

    function activateTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-pane').forEach((pane) => pane.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
    }

    function toCurrency(value) {
      return `$${Number(value || 0).toFixed(2)}`;
    }

    function twoStepConfirm(actionMessageKey) {
      const first = window.confirm(`${t('confirmStep1')}\n\n${t(actionMessageKey)}`);
      if (!first) return false;
      return window.confirm(`${t('confirmStep2')}\n\n${t(actionMessageKey)}`);
    }

    function displayProductName(product) {
      if (state.lang === 'zh') {
        return product.nameZh || product.nameEn || product.desc || '-';
      }
      return product.nameEn || product.nameZh || product.desc || '-';
    }

    function statusOptions(selected) {
      const keys = ['pending', 'under_review', 'paid', 'packing', 'shipped', 'completed'];
      return keys.map((key) => `<option value="${key}" ${selected === key ? 'selected' : ''}>${t(`status_${key}`)}</option>`).join('');
    }

    function renderStats() {
      const totalVariants = state.products.reduce((sum, product) => sum + (Array.isArray(product.variants) ? product.variants.length : 0), 0);
      const lowStock = state.products.reduce((sum, product) => sum + (product.variants || []).filter((variant) => Number(variant.stock || 0) <= 2).length, 0);
      const pendingOrders = state.orders.filter((order) => (order.status || 'pending') === 'pending').length;
      const stats = [
        [t('statProducts'), state.products.length],
        [t('statVariants'), totalVariants],
        [t('statLowStock'), lowStock],
        [t('statPendingOrders'), pendingOrders]
      ];

      document.getElementById('stats').innerHTML = stats.map(([label, value]) => `
        <div class="rounded-2xl border border-neutral-200 bg-white p-4">
          <p class="text-[10px] uppercase tracking-[0.2em] text-neutral-500 font-bold">${label}</p>
          <p class="text-3xl font-black mt-2">${value}</p>
        </div>
      `).join('');
    }

    function createVariantRow(data = {}) {
      const template = document.getElementById('variant-template');
      const node = template.content.firstElementChild.cloneNode(true);

      const colorInput = node.querySelector('.variant-color');
      const sizeInput = node.querySelector('.variant-size');
      const stockInput = node.querySelector('.variant-stock');
      const priceInput = node.querySelector('.variant-price');
      const photoFileInput = node.querySelector('.variant-photo-file');
      const photoUrlInput = node.querySelector('.variant-photo-url');
      const preview = node.querySelector('.variant-preview');

      colorInput.value = data.color || '';
      sizeInput.value = data.size || '';
      stockInput.value = Number.isFinite(Number(data.stock)) ? Number(data.stock) : 0;
      priceInput.value = Number.isFinite(Number(data.price)) ? Number(data.price) : Number(document.getElementById('product-price').value || 0);
      photoUrlInput.value = data.photo || '';

      if (photoUrlInput.value) {
        preview.src = photoUrlInput.value;
        preview.classList.remove('hidden');
      }

      photoFileInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
      });

      photoUrlInput.addEventListener('input', (event) => {
        const value = event.target.value.trim();
        if (!value) {
          preview.classList.add('hidden');
          preview.removeAttribute('src');
          return;
        }
        preview.src = value;
        preview.classList.remove('hidden');
      });

      node.querySelector('.variant-remove').addEventListener('click', () => node.remove());
      document.getElementById('variant-list').appendChild(node);
    }

    async function collectVariants() {
      const rows = Array.from(document.querySelectorAll('#variant-list > div'));
      const variants = [];

      for (const row of rows) {
        const color = row.querySelector('.variant-color').value.trim();
        const size = row.querySelector('.variant-size').value.trim().toUpperCase();
        const stock = Number(row.querySelector('.variant-stock').value || 0);
        const price = Number(row.querySelector('.variant-price').value || document.getElementById('product-price').value || 0);
        const photoUrlInput = row.querySelector('.variant-photo-url').value.trim();
        const fileInput = row.querySelector('.variant-photo-file');

        let photo = photoUrlInput;
        const file = fileInput.files && fileInput.files[0];
        if (file) {
          const formData = new FormData();
          formData.append('image', file);
          const uploaded = await api('/api/upload-image', { method: 'POST', body: formData });
          photo = uploaded.imageUrl;
        }

        if (!color || !size || !photo) continue;

        variants.push({
          id: `${color}-${size}`,
          color,
          size,
          stock: Math.max(0, Math.floor(stock)),
          price: Number.isFinite(price) ? price : Number(document.getElementById('product-price').value || 0),
          photo
        });
      }

      return variants;
    }

    function resetProductForm() {
      document.getElementById('product-form').reset();
      document.getElementById('product-id').value = '';
      document.getElementById('variant-list').innerHTML = '';
      createVariantRow({ size: 'S' });
      createVariantRow({ size: 'M' });
      createVariantRow({ size: 'L' });
    }

    function renderProducts() {
      const body = document.getElementById('products-table');
      if (!state.products.length) {
        body.innerHTML = `<tr><td class="py-6 text-neutral-500" colspan="4">${t('noData')}</td></tr>`;
        return;
      }

      body.innerHTML = state.products.map((product) => {
        const stock = Number(product.stock || 0);
        const soldOut = stock <= 0 || product.soldOut;
        return `
          <tr>
            <td class="py-4 pr-3">
              <p class="font-semibold">${displayProductName(product)}</p>
              <p class="text-xs text-neutral-500">${product.variants.length} variants</p>
            </td>
            <td class="py-4">${soldOut ? `<span class="text-red-600 font-semibold">${t('soldOut')}</span>` : stock}</td>
            <td class="py-4">${toCurrency(product.price)}</td>
            <td class="py-4 text-right space-x-2">
              <button data-edit="${product.id}" class="px-3 py-1.5 rounded-full bg-neutral-900 text-white text-xs font-semibold">${t('edit')}</button>
              <button data-delete="${product.id}" class="px-3 py-1.5 rounded-full border border-neutral-300 text-xs font-semibold">${t('delete')}</button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!twoStepConfirm('confirmEditProduct')) return;
          const product = state.products.find((entry) => String(entry.id) === btn.dataset.edit);
          if (!product) return;
          document.getElementById('product-id').value = product.id;
          document.getElementById('product-name-zh').value = product.nameZh || '';
          document.getElementById('product-name-en').value = product.nameEn || product.desc || '';
          document.getElementById('product-price').value = product.price || 0;
          document.getElementById('product-seen-at').value = product.seenAt || '';
          document.getElementById('product-desc').value = product.desc || product.nameEn || product.nameZh || '';
          document.getElementById('product-size-chart').value = product.sizeChart || '';
          document.getElementById('product-washing-info').value = product.washingInfo || '';
          document.getElementById('variant-list').innerHTML = '';
          (product.variants || []).forEach((variant) => createVariantRow(variant));
          activateTab('products');
        });
      });

      document.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!twoStepConfirm('confirmDeleteProduct')) return;
          await api(`/api/products/${btn.dataset.delete}`, { method: 'DELETE' });
          await loadAdminData();
        });
      });
    }

    function renderOrders() {
      const body = document.getElementById('orders-table');
      if (!state.orders.length) {
        body.innerHTML = `<tr><td class="py-6 text-neutral-500" colspan="7">${t('noData')}</td></tr>`;
        return;
      }

      body.innerHTML = state.orders.map((order) => {
        const itemsText = (order.items || []).map((item) => `${item.desc || item.productTitle || `#${item.id}`} x${item.qty || 1}`).join(', ');
        return `
          <tr>
            <td class="py-4 pr-3">#${order.id}<br><span class="text-xs text-neutral-500">${toCurrency(order.total)}</span></td>
            <td class="py-4 pr-3">${order.customerName || '-'}<br><span class="text-xs text-neutral-500">${order.customerEmail || ''} ${order.customerPhone ? `• ${order.customerPhone}` : ''}</span></td>
            <td class="py-4 pr-3 text-xs text-neutral-600">${itemsText || '-'}</td>
            <td class="py-4 pr-3 text-xs text-neutral-600">${order.shippingAddress || '-'}</td>
            <td class="py-4">
              <div class="space-y-2">
                <select data-status="${order.id}" class="w-full rounded-xl border border-neutral-300 px-2 py-1 text-xs">${statusOptions(order.status || 'pending')}</select>
                <select data-payment="${order.id}" class="w-full rounded-xl border border-neutral-300 px-2 py-1 text-xs">${statusOptions(order.paymentStatus || 'pending')}</select>
              </div>
            </td>
            <td class="py-4">
              <input data-track="${order.id}" type="text" class="w-full rounded-xl border border-neutral-300 px-2 py-1 text-xs" value="${order.trackingNumber || ''}" placeholder="SF123..." />
            </td>
            <td class="py-4 text-right">
              <button data-save-order="${order.id}" class="px-3 py-1.5 rounded-full bg-black text-white text-xs font-semibold">${t('save')}</button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('[data-save-order]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!twoStepConfirm('confirmSaveOrder')) return;
          const id = btn.dataset.saveOrder;
          const status = document.querySelector(`[data-status="${id}"]`).value;
          const paymentStatus = document.querySelector(`[data-payment="${id}"]`).value;
          const trackingNumber = document.querySelector(`[data-track="${id}"]`).value.trim();
          await api(`/api/orders/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status, paymentStatus, trackingNumber })
          });
          alert(t('orderSaved'));
          await loadAdminData();
        });
      });
    }

    function renderCoupons() {
      const root = document.getElementById('coupon-list');
      if (!state.coupons.length) {
        root.innerHTML = `<div class="rounded-xl border border-neutral-200 p-4 text-sm text-neutral-500">${t('noData')}</div>`;
        return;
      }

      root.innerHTML = state.coupons.map((coupon) => `
        <div class="rounded-xl border border-neutral-200 bg-white p-4">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="font-bold">${coupon.code}</p>
              <p class="text-xs text-neutral-500">${coupon.type === 'fixed' ? `$${coupon.value}` : `${coupon.value}%`} • min ${toCurrency(coupon.minSpend || 0)} ${coupon.targetProductId ? `• Product #${coupon.targetProductId}` : ''}</p>
              <p class="text-xs text-neutral-500 mt-1">${coupon.description || ''}</p>
            </div>
            <button data-delete-coupon="${coupon.code}" class="px-3 py-1.5 rounded-full border border-neutral-300 text-xs font-semibold">${t('delete')}</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-delete-coupon]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!twoStepConfirm('confirmDeleteCoupon')) return;
          await api(`/api/coupons/${encodeURIComponent(btn.dataset.deleteCoupon)}`, { method: 'DELETE' });
          await loadAdminData();
        });
      });
    }

    function renderStaff() {
      const root = document.getElementById('staff-list');
      if (!state.staff.length) {
        root.innerHTML = `<div class="rounded-xl border border-neutral-200 p-4 text-sm text-neutral-500">${t('noData')}</div>`;
        return;
      }

      root.innerHTML = state.staff.map((member) => `
        <div class="rounded-xl border border-neutral-200 bg-white p-4 flex items-start justify-between gap-3">
          <div>
            <p class="font-semibold">${member.name || '-'}</p>
            <p class="text-xs text-neutral-500">${member.email} • ${member.role}</p>
          </div>
          ${member.role === 'owner' ? '' : `<button data-remove-staff="${member.id}" class="px-3 py-1.5 rounded-full border border-neutral-300 text-xs font-semibold">${t('delete')}</button>`}
        </div>
      `).join('');

      document.querySelectorAll('[data-remove-staff]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          if (!twoStepConfirm('confirmDeleteStaff')) return;
          await api(`/api/admin/staff/${btn.dataset.removeStaff}`, { method: 'DELETE' });
          await loadAdminData();
        });
      });
    }

    async function loadAdminData() {
      if (!state.adminToken) return;
      const [products, orders, users, coupons, shippingRules, staff] = await Promise.all([
        api('/api/products'),
        api('/api/admin/orders'),
        api('/api/users'),
        api('/api/coupons'),
        api('/api/shipping-rules'),
        api('/api/admin/staff')
      ]);

      state.products = products || [];
      state.orders = orders || [];
      state.users = users || [];
      state.coupons = coupons || [];
      state.shippingRules = shippingRules || { freeShippingThreshold: 500, defaultShippingFee: 35 };
      state.staff = staff || [];

      document.getElementById('free-shipping-threshold').value = Number(state.shippingRules.freeShippingThreshold || 500);
      document.getElementById('default-shipping-fee').value = Number(state.shippingRules.defaultShippingFee || 35);

      renderStats();
      renderProducts();
      renderOrders();
      renderCoupons();
      renderStaff();
    }

    async function loginAdmin() {
      const email = document.getElementById('gate-email').value.trim();
      const passcode = document.getElementById('gate-passcode').value.trim();
      if (!email || !passcode) {
        document.getElementById('gate-status').textContent = t('loginFailed');
        return;
      }

      try {
        const result = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, passcode })
        }).then(async (response) => {
          if (!response.ok) throw new Error(await response.text());
          return response.json();
        });

        state.adminToken = result.token;
        state.adminEmail = result.email || email;
        localStorage.setItem('boutique-admin-token', state.adminToken);
        localStorage.setItem('boutique-admin-email', state.adminEmail);

        document.getElementById('gate-status').textContent = t('loginSuccess');
        unlockDashboard();
        await loadAdminData();
        activateTab('overview');
      } catch (_error) {
        document.getElementById('gate-status').textContent = t('loginFailed');
      }
    }

    function logoutAdmin() {
      state.adminToken = '';
      state.adminEmail = '';
      localStorage.removeItem('boutique-admin-token');
      localStorage.removeItem('boutique-admin-email');
      location.reload();
    }

    function bindEvents() {
      document.getElementById('gate-unlock').addEventListener('click', loginAdmin);
      document.getElementById('gate-passcode').addEventListener('keydown', (event) => {
        if (event.key === 'Enter') loginAdmin();
      });

      document.getElementById('lang-toggle').addEventListener('click', () => {
        state.lang = state.lang === 'zh' ? 'en' : 'zh';
        localStorage.setItem('boutique-lang', state.lang);
        applyLanguage();
      });

      document.getElementById('logout-admin').addEventListener('click', logoutAdmin);

      document.querySelectorAll('.tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => activateTab(btn.dataset.tab));
      });

      document.getElementById('add-variant').addEventListener('click', () => createVariantRow());
      document.getElementById('reset-form').addEventListener('click', resetProductForm);

      document.getElementById('product-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!state.adminToken) {
          alert(t('authRequired'));
          return;
        }
        if (!twoStepConfirm('confirmSaveProduct')) return;

        const variants = await collectVariants();
        const nameZh = document.getElementById('product-name-zh').value.trim();
        const nameEn = document.getElementById('product-name-en').value.trim();
        const payload = {
          nameZh,
          nameEn,
          desc: document.getElementById('product-desc').value.trim() || nameEn || nameZh,
          title: nameEn || nameZh,
          price: Number(document.getElementById('product-price').value || 0),
          seenAt: document.getElementById('product-seen-at').value.trim(),
          sizeChart: document.getElementById('product-size-chart').value.trim(),
          washingInfo: document.getElementById('product-washing-info').value.trim(),
          photo: variants[0]?.photo || '',
          variants,
          sizes: [...new Set(variants.map((entry) => entry.size))]
        };

        const productId = document.getElementById('product-id').value;
        if (productId) {
          await api(`/api/products/${productId}`, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
          await api('/api/products', { method: 'POST', body: JSON.stringify(payload) });
        }

        alert(t('productSaved'));
        resetProductForm();
        await loadAdminData();
      });

      document.getElementById('coupon-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!twoStepConfirm('confirmSaveCoupon')) return;
        const payload = {
          code: document.getElementById('coupon-code').value.trim().toUpperCase(),
          type: document.getElementById('coupon-type').value,
          value: Number(document.getElementById('coupon-value').value || 0),
          minSpend: Number(document.getElementById('coupon-min-spend').value || 0),
          targetProductId: document.getElementById('coupon-target-product').value ? Number(document.getElementById('coupon-target-product').value) : null,
          description: document.getElementById('coupon-desc').value.trim(),
          active: true
        };

        await api('/api/coupons', { method: 'POST', body: JSON.stringify(payload) });
        alert(t('couponSaved'));
        document.getElementById('coupon-form').reset();
        await loadAdminData();
      });

      document.getElementById('shipping-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!twoStepConfirm('confirmSaveShipping')) return;
        const payload = {
          freeShippingThreshold: Number(document.getElementById('free-shipping-threshold').value || 0),
          defaultShippingFee: Number(document.getElementById('default-shipping-fee').value || 0)
        };
        await api('/api/shipping-rules', { method: 'PUT', body: JSON.stringify(payload) });
        alert(t('shippingSaved'));
        await loadAdminData();
      });

      document.getElementById('staff-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!twoStepConfirm('confirmAddStaff')) return;
        const payload = {
          email: document.getElementById('staff-email').value.trim(),
          password: document.getElementById('staff-password').value,
          name: document.getElementById('staff-name').value.trim(),
          role: document.getElementById('staff-role').value
        };

        await api('/api/admin/staff', { method: 'POST', body: JSON.stringify(payload) });
        alert(t('staffAdded'));
        document.getElementById('staff-form').reset();
        await loadAdminData();
      });
    }

    async function init() {
      bindEvents();
      resetProductForm();
      applyLanguage();

      if (state.adminToken) {
        try {
          await api('/api/admin/session');
          unlockDashboard();
          await loadAdminData();
          activateTab('overview');
        } catch (_error) {
          logoutAdmin();
        }
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
